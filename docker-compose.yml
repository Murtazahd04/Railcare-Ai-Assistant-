version: "3.9"

# Usage:
#   docker compose up --build                 -> server + client (fast, what most people want)
#   docker compose --profile ai up --build     -> also starts the AI microservice
#   docker compose --profile local-db up --build -> also starts a local MongoDB instead of Atlas
#
# server/.env is still where your real secrets (Mongo URI, JWT secret,
# Razorpay keys, Twilio fallback number) live — this file only overrides
# what has to change for container networking (AI_SERVICE_URL).

services:
  server:
    build: ./server
    ports:
      - "4000:4000"
    env_file:
      - ./server/.env
    environment:
      # inside the Docker network, the AI service is reachable by its
      # service name, not "localhost" — this overrides whatever's in .env.
      # Harmless if ai-service isn't running: classifier.js falls back
      # automatically (see README section 8).
      AI_SERVICE_URL: http://ai-service:8001

  client:
    build: ./client
    ports:
      - "5173:5173"
    depends_on:
      - server

  ai-service:
    build: ./ai-service
    ports:
      - "8001:8001"
    profiles: ["ai"] # only starts with `docker compose --profile ai up`
    volumes:
      - ai-models-cache:/root/.cache # keeps downloaded models between restarts

  # optional local MongoDB, if you'd rather not use Atlas.
  # Switch server/.env's MONGO_URI to mongodb://mongo:27017/srlms to use this.
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    profiles: ["local-db"]
    volumes:
      - mongo-data:/data/db

volumes:
  ai-models-cache:
  mongo-data:
